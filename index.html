<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Play free online games at KGT Games by Krishna Gopal Tak (KGT Universal). Explore instant puzzle, adventure, horror, racing, simulation, and business games!">
    <meta name="keywords" content="Krishna Gopal Tak, Krishna Tak, Krishna, KGT Games, KGT Universal, Free Games, KGT, Games, online games, free browser games">
    <meta name="author" content="Krishna Gopal Tak (KGT Universal)">
    
    <!-- Open Graph -->
    <meta property="og:title" content="KGT Games - Free Online Games by Krishna Gopal Tak (KGT Universal)">
    <meta property="og:description" content="Play free instant online games on KGT Games. No downloads needed!">
    <meta property="og:type" content="website">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "KGT Games",
      "alternateName": ["KGT Universal", "KGT Games Portal"],
      "url": "https://kgt-universal-official.github.io/KGTGames/",
      "creator": {
        "@type": "Person",
        "name": "Krishna Gopal Tak",
        "alternate_name": "Krishna Tak"
      }
    }
    </script>

    <link rel="stylesheet" href="style.css">
    <!-- Google Identity Services Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <!-- Header & Search Bar -->
    <header class="app-header">
        <div class="search-container">
            <input type="text" id="game-search" placeholder="🔍 Search free games..." onkeyup="filterGames()">
        </div>

        <!-- Main Navigation Action Bar -->
        <div class="main-nav-cards">
            <button class="nav-card active" id="nav-all" onclick="filterCategory('all')">🎮 Games</button>
            <button class="nav-card" id="nav-recent" onclick="showRecentGames()">🕒 Recent</button>
            <button class="nav-card" id="nav-fav" onclick="showFavoriteGames()">❤️ Favorites</button>
            <button class="nav-card" id="profile-btn" onclick="handleProfileClick()">👤 Account</button>
        </div>

        <!-- Categories Bar with Scroll Navigation Buttons -->
        <div class="categories-wrapper">
            <button class="scroll-arrow-btn left-arrow" onclick="scrollCategories(-1)">&#10094;</button>
            <div class="categories-bar" id="categories-container">
                <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
                <button class="cat-btn" onclick="filterCategory('puzzle', this)">🧩 Puzzle</button>
                <button class="cat-btn" onclick="filterCategory('adventure', this)">🏹 Adventure</button>
                <button class="cat-btn" onclick="filterCategory('horror', this)">👻 Horror</button>
                <button class="cat-btn" onclick="filterCategory('racing', this)">🏎️ Racing</button>
                <button class="cat-btn" onclick="filterCategory('simulation', this)">🚌 Simulation</button>
                <button class="cat-btn" onclick="filterCategory('business', this)">💼 Business</button>
            </div>
            <button class="scroll-arrow-btn right-arrow" onclick="scrollCategories(1)">&#10095;</button>
        </div>
    </header>

    <!-- Games Grid Container -->
    <main class="games-grid-wrapper">
        <div class="games-grid" id="games-container">
            <!-- Dynamic Uniform Tiles Load Here -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="auth.js"></script>
    <script src="games-data.js"></script>
    <script src="app.js"></script>
    <script>
        function showFavoriteGames() {
            const favList = gamesList.filter(g => favorites.includes(g.id));
            renderGames(favList);
            updateNavActive('nav-fav');
        }
        function showRecentGames() {
            const recList = recentGames.map(id => gamesList.find(g => g.id === id)).filter(Boolean);
            renderGames(recList);
            updateNavActive('nav-recent');
        }
        function updateNavActive(activeId) {
            document.querySelectorAll('.nav-card').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(activeId);
            if(activeBtn) activeBtn.classList.add('active');
        }
        function scrollCategories(direction) {
            const container = document.getElementById('categories-container');
            if(container) {
                container.scrollBy({ left: direction * 150, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
